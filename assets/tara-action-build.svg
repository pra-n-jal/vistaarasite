<svg viewBox="0 0 400 480" width="400" height="480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="cyanGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="amberGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/>
    </filter>

    <radialGradient id="coreRadialGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1E3A73" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#00D1FF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#12172B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#EAE6D9"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="headGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="85%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="blueprintGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1E3A73"/>
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE066"/>
      <stop offset="50%" stop-color="#FFB703"/>
      <stop offset="100%" stop-color="#E6A400"/>
    </linearGradient>
    <linearGradient id="visorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#060913"/>
      <stop offset="100%" stop-color="#121829"/>
    </linearGradient>
  </defs>

  

  <!-- Mascot Master Group -->
  <g id="taraMascotGroup" transform="translate(0, 10)">
    
    <!-- Magnetic Levitation Base Ring -->
    <ellipse cx="200" cy="425" rx="70" ry="12" fill="none" stroke="#00D1FF" stroke-width="2.5" stroke-dasharray="8 4" opacity="0.6"/>
    <ellipse cx="200" cy="425" rx="42" ry="7" fill="rgba(0, 209, 255, 0.2)" filter="url(#cyanGlow)"/>

    <!-- Left & Right Floating Hands -->
    <g transform="translate(80, 255)">
      <circle cx="20" cy="20" r="16" fill="url(#headGrad)" stroke="#12172B" stroke-width="2.5" filter="url(#cardShadow)"/>
      <circle cx="20" cy="20" r="6" fill="#1E3A73"/>
    </g>
    <g transform="translate(280, 255)">
      <circle cx="20" cy="20" r="16" fill="url(#headGrad)" stroke="#12172B" stroke-width="2.5" filter="url(#cardShadow)"/>
      <circle cx="20" cy="20" r="6" fill="#1E3A73"/>
    </g>

    
        <!-- Build Pose: Floating Code Brackets & App Window -->
        <g transform="translate(85, 270)">
          <rect x="0" y="0" width="60" height="70" rx="8" fill="#12172B" stroke="#00D1FF" stroke-width="2" filter="url(#cardShadow)"/>
          <text x="30" y="42" font-family="'Space Mono', monospace" font-size="22" font-weight="bold" fill="#FFB703" text-anchor="middle">&lt;/&gt;</text>
          <circle cx="12" cy="12" r="3" fill="#E63946"/>
          <circle cx="22" cy="12" r="3" fill="#FFB703"/>
          <circle cx="32" cy="12" r="3" fill="#10B981"/>
        </g>
        <g transform="translate(255, 270)">
          <rect x="0" y="0" width="60" height="70" rx="8" fill="#12172B" stroke="#FFB703" stroke-width="2" filter="url(#cardShadow)"/>
          <text x="30" y="42" font-family="'Space Mono', monospace" font-size="20" font-weight="bold" fill="#00D1FF" text-anchor="middle">{ }</text>
          <rect x="10" y="52" width="40" height="4" rx="2" fill="rgba(255,255,255,0.4)"/>
        </g>
        

    <!-- Torso -->
    <g id="torso">
      <path d="M 145 235 L 255 235 L 245 355 Q 200 375 155 355 Z" fill="url(#bodyGrad)" stroke="#12172B" stroke-width="3"/>
      
      <path d="M 160 235 L 200 295 L 240 235 Z" fill="url(#blueprintGrad)" stroke="#12172B" stroke-width="2"/>
      
      <path d="M 188 250 L 200 270 L 212 250 L 205 250 L 200 260 L 195 250 Z" fill="#FFB703" filter="url(#amberGlow)"/>
      
      <rect x="175" y="325" width="50" height="12" rx="4" fill="#12172B"/>
      <rect x="180" y="328" width="8" height="6" rx="1.5" fill="#00D1FF"/>
      <rect x="192" y="328" width="8" height="6" rx="1.5" fill="#FFB703"/>
      <rect x="204" y="328" width="16" height="6" rx="1.5" fill="#2563EB"/>

      <path d="M 168 360 L 164 400 Q 180 406 192 400 L 190 365 Z" fill="#1E3A73" stroke="#12172B" stroke-width="2.5"/>
      <path d="M 232 360 L 236 400 Q 220 406 208 400 L 210 365 Z" fill="#1E3A73" stroke="#12172B" stroke-width="2.5"/>
      <ellipse cx="178" cy="402" rx="14" ry="4" fill="#00D1FF" filter="url(#cyanGlow)"/>
      <ellipse cx="222" cy="402" rx="14" ry="4" fill="#00D1FF" filter="url(#cyanGlow)"/>
    </g>

    <!-- Head / Helmet -->
    <g id="head">
      <rect x="185" y="215" width="30" height="22" rx="4" fill="#1E3A73" stroke="#12172B" stroke-width="2"/>

      <!-- Ear Pods -->
      <g transform="translate(86, 155)">
        <rect x="0" y="0" width="22" height="46" rx="8" fill="#1E3A73" stroke="#12172B" stroke-width="2.5"/>
        <circle cx="11" cy="23" r="7" fill="#00D1FF" filter="url(#cyanGlow)"/>
        <line x1="11" y1="5" x2="11" y2="41" stroke="#3E5FA3" stroke-width="2"/>
      </g>
      <g transform="translate(292, 155)">
        <rect x="0" y="0" width="22" height="46" rx="8" fill="#1E3A73" stroke="#12172B" stroke-width="2.5"/>
        <circle cx="11" cy="23" r="7" fill="#FFB703" filter="url(#amberGlow)"/>
        <line x1="11" y1="5" x2="11" y2="41" stroke="#3E5FA3" stroke-width="2"/>
      </g>

      <rect x="100" y="105" width="200" height="135" rx="36" fill="url(#headGrad)" stroke="#12172B" stroke-width="3.5" filter="url(#cardShadow)"/>

      <rect x="116" y="130" width="168" height="92" rx="20" fill="url(#visorGrad)" stroke="#1E3A73" stroke-width="2"/>
      <path d="M 124 138 Q 200 134 274 146 Q 200 142 124 138 Z" fill="rgba(255, 255, 255, 0.25)"/>

      
        <!-- Excited Eyes: Joyful Squints > < -->
        <path d="M 155 172 L 180 185 L 155 198" stroke="#00D1FF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#cyanGlow)"/>
        <path d="M 245 172 L 220 185 L 245 198" stroke="#00D1FF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#cyanGlow)"/>
        <path d="M 190 205 Q 200 218 210 205 Z" fill="#00D1FF" filter="url(#cyanGlow)"/>
        <circle cx="146" cy="198" r="9" fill="rgba(255, 183, 3, 0.55)"/>
        <circle cx="254" cy="198" r="9" fill="rgba(255, 183, 3, 0.55)"/>
        

      <g id="guidingStarAntenna">
        <rect x="196" y="65" width="8" height="42" rx="3" fill="#1E3A73" stroke="#12172B" stroke-width="2"/>
        <circle cx="200" cy="70" r="6" fill="#00D1FF" filter="url(#cyanGlow)"/>
        
        <g transform="translate(200, 48)" filter="url(#amberGlow)">
          <circle cx="0" cy="0" r="18" fill="rgba(255, 183, 3, 0.25)"/>
          <path d="M 0 -22 Q 0 0 22 0 Q 0 0 0 22 Q 0 0 -22 0 Q 0 0 0 -22 Z" fill="url(#starGrad)" stroke="#12172B" stroke-width="1.5"/>
          <circle cx="0" cy="0" r="4.5" fill="#FFFFFF"/>
        </g>
      </g>

    </g>

    <circle cx="100" cy="90" r="3.5" fill="#00D1FF" opacity="0.8"/>
    <circle cx="310" cy="110" r="4" fill="#FFB703" opacity="0.9"/>
    <circle cx="330" cy="340" r="3" fill="#00D1FF" opacity="0.6"/>
    <circle cx="70" cy="330" r="3.5" fill="#FFB703" opacity="0.7"/>

  </g>
</svg>